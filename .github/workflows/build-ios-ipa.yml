name: Build unsigned iPhone IPA

# Produces an unsigned device .ipa that you can re-sign locally on Windows
# with Sideloadly or AltStore using a free Apple ID (certificate lasts 7 days).

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier (must be unique for your Apple ID)"
        required: true
        default: "com.example.liquidledger.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: Build unsigned device app
        run: |
          set -o pipefail
          {
            echo "== Toolchain =="
            xcodebuild -version
            swift --version || true
            echo "== Build =="
            xcodebuild \
              -project LiquidLedger/LiquidLedger.xcodeproj \
              -scheme LiquidLedger \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              SYMROOT="$RUNNER_TEMP/build" \
              PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn

      - name: Publish log tail to summary
        if: always()
        run: |
          {
            echo "### Error lines"
            echo '```'
            grep -n "error:" "$RUNNER_TEMP/build.log" 2>/dev/null | tail -n 80 || echo "no 'error:' lines found"
            echo '```'
            echo "### Build log (last 300 lines)"
            echo '```'
            tail -n 300 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "build.log not found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP/build/Release-iphoneos"
          mkdir -p Payload
          cp -R LiquidLedger.app Payload/
          zip -qry LiquidLedger-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidLedger-unsigned-ipa
          path: ${{ runner.temp }}/build/Release-iphoneos/LiquidLedger-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to Releases
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/build/Release-iphoneos/LiquidLedger-unsigned.ipa" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA. Install with Sideloadly using your Apple ID." \
            --prerelease