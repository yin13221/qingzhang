name: Build iOS simulator app

# Goal: produce a simulator .app on a macOS runner so it can be streamed
# in a Windows browser through a cloud simulator such as Appetize.io.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: Build for simulator (universal slice)
        run: |
          set -o pipefail
          {
            echo "== Toolchain =="
            xcodebuild -version
            echo "== Build =="
            xcodebuild \
              -project LiquidLedger/LiquidLedger.xcodeproj \
              -target LiquidLedger \
              -sdk iphonesimulator \
              -configuration Debug \
              SYMROOT="$RUNNER_TEMP/build" \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn

      - name: Publish log tail to summary
        if: always()
        run: |
          {
            echo "### Error lines"
            echo '```'
            grep -n "error:" "$RUNNER_TEMP/build.log" 2>/dev/null | tail -n 80 || echo "no 'error:' lines found"
            echo '```'
            echo "### Build log (last 300 lines)"
            echo '```'
            tail -n 300 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "build.log not found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package .app
        run: |
          cd "$RUNNER_TEMP/build/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent LiquidLedger.app LiquidLedger.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidLedger-simulator
          path: ${{ runner.temp }}/build/Debug-iphonesimulator/LiquidLedger.zip
          if-no-files-found: error